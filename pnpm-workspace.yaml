packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@railway/cli': true
  '@scarf/scarf': false
  esbuild: true
  ffmpeg-static: set this to true or false
  msgpackr-extract: true
  prisma: true
  sharp: true

onlyBuiltDependencies:
  - esbuild
  - msgpackr-extract
  - sharp

ignoredBuiltDependencies:
  - '@scarf/scarf'
